<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Vault - Thư Viện Truyện Tranh</title>
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="description" content="Danh sách quản lý và tìm kiếm truyện tranh manga chuyên nghiệp">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@700;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0c12;
            --surface-color: #161824;
            --accent-red: #ff3e3e;
            --accent-yellow: #f5b041;
            --text-primary: #ffffff;
            --text-secondary: #a0a5bd;
            --neon-glow: 0 0 20px rgba(255, 62, 62, 0.8);
            --manga-border: 4px solid #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                /* Manga action speed background line elements */
                repeating-linear-gradient(45deg, rgba(255, 62, 62, 0.005) 0px, rgba(255, 62, 62, 0.005) 2px, transparent 2px, transparent 10px),
                /* Classic halftone dot pattern */
                radial-gradient(rgba(255, 255, 255, 0.035) 15%, transparent 16%),
                radial-gradient(rgba(255, 255, 255, 0.035) 15%, transparent 16%);
            background-size: 80px 80px, 20px 20px, 20px 20px;
            background-position: 0 0, 0 0, 10px 10px;
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 50px;
            position: relative;
        }

        /* Floating Anime SFX Katakana with smooth floating drift animation */
        .sfx-bg {
            position: fixed;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            color: rgba(255, 62, 62, 0.03);
            font-size: 8rem;
            user-select: none;
            pointer-events: none;
            z-index: -1;
            white-space: nowrap;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
        }

        @keyframes floatSFX1 {
            0% {
                transform: translateY(0px) rotate(-15deg);
            }

            50% {
                transform: translateY(-15px) rotate(-12deg);
            }

            100% {
                transform: translateY(0px) rotate(-15deg);
            }
        }

        @keyframes floatSFX2 {
            0% {
                transform: translateY(0px) rotate(15deg);
            }

            50% {
                transform: translateY(20px) rotate(18deg);
            }

            100% {
                transform: translateY(0px) rotate(15deg);
            }
        }

        .sfx-gogo {
            top: 15%;
            left: -2%;
            animation: floatSFX1 8s infinite ease-in-out;
        }

        .sfx-dodo {
            bottom: 20%;
            right: -2%;
            animation: floatSFX2 9s infinite ease-in-out;
            color: rgba(245, 176, 65, 0.03);
        }

        .sfx-shaa {
            top: 55%;
            left: 82%;
            font-size: 6rem;
            animation: floatSFX1 7s infinite ease-in-out;
        }

        .sfx-baaan {
            bottom: 45%;
            left: 4%;
            font-size: 7rem;
            animation: floatSFX2 10s infinite ease-in-out;
        }

        /* Falling Shuriken (Phi tiêu) Particle System Style - CLEARER AND MORE VISIBLE */
        #shuriken-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            /* Behind main layout but above background patterns */
            overflow: hidden;
        }

        .shuriken-particle {
            position: absolute;
            top: -60px;
            pointer-events: none;
            user-select: none;
            animation: shurikenFall linear infinite;
        }

        @keyframes shurikenFall {
            0% {
                transform: translateY(-60px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(105vh) rotate(1800deg);
                opacity: 0;
            }
        }

        header {
            position: relative;
            background: linear-gradient(135deg, #07080c, #11131c);
            border-bottom: 6px solid var(--accent-red);
            padding: 55px 20px;
            text-align: center;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        /* Anime Speed Lines in Header Background */
        header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 62, 62, 0.07) 0deg 1.5deg, transparent 1.5deg 4deg),
                radial-gradient(circle at 50% 50%, transparent 35%, rgba(7, 8, 12, 0.9) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .logo-container {
            position: relative;
            z-index: 2;
            display: inline-block;
            transform: rotate(-1.5deg);
            margin-bottom: 15px;
            animation: titlePulse 2s infinite alternate ease-in-out;
        }

        @keyframes titlePulse {
            0% {
                transform: rotate(-1.5deg) scale(1);
            }

            100% {
                transform: rotate(-2deg) scale(1.03);
            }
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 5.5rem;
            color: #fff;
            text-shadow:
                4px 4px 0 #000,
                -4px -4px 0 #000,
                4px -4px 0 #000,
                -4px 4px 0 #000,
                0px 8px 0 var(--accent-red),
                0 0 30px rgba(255, 62, 62, 0.7);
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--accent-yellow);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 800;
            z-index: 2;
            position: relative;
            text-shadow: 3px 3px 0 #000;
        }

        /* Hero Carousel Section */
        .hero-section {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        .carousel {
            position: relative;
            height: 380px;
            border-radius: 12px;
            overflow: hidden;
            border: var(--manga-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 80px;
            /* Parallax zoom effect for slide background */
            animation: zoomEffect 20s infinite alternate linear;
        }

        @keyframes zoomEffect {
            0% {
                background-size: 100% auto;
            }

            100% {
                background-size: 110% auto;
            }
        }

        .slide.active {
            opacity: 1;
            z-index: 2;
        }

        /* Anime action speed lines shooting out from the book cover */
        .slide-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 80% 50%, rgba(11, 12, 16, 0.1) 10%, rgba(11, 12, 16, 0.95) 75%),
                repeating-conic-gradient(from 0deg at 80% 50%, rgba(255, 62, 62, 0.05) 0deg 1deg, transparent 1deg 3deg);
            z-index: 1;
        }

        .slide-content-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 3;
            position: relative;
        }

        .slide-content {
            max-width: 550px;
        }

        .slide-cover-container {
            width: 180px;
            height: 260px;
            border: 4px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 255, 255, 0.35);
            transform: rotate(3deg) scale(1.05);
            transition: transform 0.5s ease;
            background-color: #222;
        }

        .slide.active .slide-cover-container {
            transform: rotate(5deg) translateY(-10px) scale(1.1);
        }

        .slide-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-badge {
            display: inline-block;
            background-color: var(--accent-red);
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            padding: 6px 12px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            transform: skew(-10deg);
            border: 2px solid #000;
            margin-bottom: 12px;
            box-shadow: 3px 3px 0 #000;
        }

        .slide-title {
            font-size: 2.6rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
            text-shadow: 3px 3px 0 #000;
        }

        .slide-desc {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.8);
            border: 3px solid #fff;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-btn:hover {
            background-color: var(--accent-red);
            border-color: #000;
            transform: translateY(-50%) scale(1.15) rotate(5deg);
            box-shadow: var(--neon-glow);
        }

        .carousel-prev {
            left: 20px;
        }

        .carousel-next {
            right: 20px;
        }

        .carousel-dots {
            position: absolute;
            bottom: 25px;
            left: 80px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            border: 1px solid #000;
        }

        .dot.active {
            background-color: var(--accent-red);
            transform: scale(1.3);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        /* Search and Filter Section */
        .search-section {
            background-color: var(--surface-color);
            border: var(--manga-border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 8px 8px 0 #000;
            position: relative;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            padding-right: 50px;
            font-size: 1.1rem;
            background-color: #0b0c10;
            border: 3px solid #000;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 4px 4px 0 #000;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-red);
            box-shadow: var(--neon-glow), 4px 4px 0 #000;
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-red);
            font-size: 1.3rem;
            pointer-events: none;
        }

        .stats-badge {
            background-color: #000;
            border: 3px solid var(--accent-yellow);
            color: var(--accent-yellow);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.4);
            white-space: nowrap;
        }

        /* Alphabet Quick Navigation */
        .alphabet-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed rgba(255, 255, 255, 0.1);
        }

        .letter-btn {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #111;
            border: 2px solid #000;
            border-radius: 6px;
            color: var(--text-secondary);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .letter-btn:hover,
        .letter-btn.active {
            background-color: var(--accent-red);
            color: white;
            border-color: #000;
            transform: scale(1.15) rotate(-5deg);
        }

        /* Manga Grid Layout - RESPONSIVE CODES */
        .manga-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            /* Mobile: 2 items per row */
            gap: 15px;
            margin-top: 20px;
        }

        @media (min-width: 600px) {
            .manga-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .manga-grid {
                grid-template-columns: repeat(6, minmax(0, 1fr));
                /* Desktop: 5 items per row */
                gap: 25px;
            }
        }

        /* Manga Card - COMPACT DESIGN */
        .manga-card {
            background-color: var(--surface-color);
            border: var(--manga-border);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            box-shadow: 6px 6px 0 #000;
            position: relative;
        }

        .manga-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 10px 10px 0 var(--accent-red);
            border-color: #000;
        }

        .card-header {
            position: relative;
            height: 220px;
            background-color: #0f1015;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Full cover image styling for responsive cover */
        .card-cover-full {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .manga-card:hover .card-cover-full {
            transform: scale(1.08);
        }

        /* Generic cover card placeholder style */
        .generic-cover {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-yellow));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-family: 'Bangers', cursive;
            font-size: 2.2rem;
            text-shadow: 1.5px 1.5px 0 #fff;
            z-index: 1;
        }

        .id-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: var(--accent-yellow);
            color: #000;
            font-weight: 800;
            padding: 3px 6px;
            font-size: 0.75rem;
            border-radius: 4px;
            border: 2px solid #000;
            z-index: 3;
            box-shadow: 2px 2px 0 #000;
        }

        /* HOT Tag in TOP-RIGHT corner of the card */
        .featured-tag {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: var(--accent-red);
            color: white;
            font-weight: 900;
            font-size: 0.7rem;
            padding: 3px 6px;
            border-radius: 4px;
            border: 2px solid #000;
            box-shadow: 2px 2px 0 #000;
            text-transform: uppercase;
            z-index: 3;
            letter-spacing: 0.5px;
            transform: rotate(3deg);
        }

        /* COMPACT CARD TITLE BOX: Footer completely removed to eliminate empty space */
        .card-title-box {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px 12px 10px 12px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: linear-gradient(to top, rgba(11, 12, 18, 0.98) 0%, rgba(11, 12, 18, 0.75) 60%, rgba(11, 12, 18, 0) 100%);
            z-index: 2;
            border-top: none;
        }

        .manga-title {
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.3;
            color: #fff;
            text-align: center;
            word-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            width: 100%;
            height: 2.6em;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.95);
            margin: 0;
            transition: color 0.2s;
        }

        .manga-card:hover .manga-title {
            color: var(--accent-yellow);
        }

        /* Smart Pagination Panel with speech bubble statistics */
        .pagination-container {
            background-color: var(--surface-color);
            border: var(--manga-border);
            border-radius: 12px;
            padding: 20px;
            margin: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 6px 6px 0 #000;
        }

        .pagination-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.95rem;
            padding-bottom: 12px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.08);
        }

        .page-size-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-size-select {
            background-color: #0b0c10;
            border: 2px solid #000;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-size-select:focus {
            border-color: var(--accent-red);
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .page-btn {
            background-color: #0b0c10;
            color: var(--text-primary);
            border: 2px solid #000;
            padding: 8px 14px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000;
            transition: all 0.2s;
        }

        .page-btn:hover {
            background-color: var(--accent-yellow);
            color: #000;
            transform: translateY(-2px) rotate(-2deg);
        }

        .page-btn.active {
            background-color: var(--accent-red);
            color: white;
            box-shadow: 1px 1px 0 #000;
            transform: translate(1px, 1px);
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            box-shadow: 2px 2px 0 #000;
        }

        .page-ellipsis {
            font-weight: bold;
            color: var(--text-secondary);
            padding: 0 4px;
        }

        /* No Results speech bubble state */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
        }

        .bubble-container {
            display: inline-block;
            position: relative;
            background: #fff;
            color: #000;
            border: 4px solid #000;
            border-radius: 30px;
            padding: 30px;
            max-width: 400px;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.5);
            font-weight: 800;
            font-size: 1.25rem;
            margin-bottom: 25px;
        }

        .bubble-container::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 20px 20px 0;
            border-style: solid;
            border-color: #fff transparent;
            display: block;
            width: 0;
            z-index: 1;
        }

        .bubble-container::before {
            content: '';
            position: absolute;
            bottom: -26px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 23px 23px 0;
            border-style: solid;
            border-color: #000 transparent;
            display: block;
            width: 0;
            z-index: 0;
        }

        .no-results-img {
            width: 300px;
            height: 300px;
            margin: 15px auto 0 auto;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
        }

        /* Floating Actions */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background-color: var(--accent-red);
            color: white;
            border: 2px solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            background-color: var(--accent-yellow);
            color: #000;
            transform: translateY(-5px);
        }

        /* Responsive Design adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.8rem;
            }

            .carousel {
                height: 320px;
            }

            .slide {
                padding: 20px 30px;
            }

            .slide-title {
                font-size: 1.6rem;
                text-shadow: 2px 2px 0 #000;
            }

            .slide-cover-container {
                width: 100px;
                height: 150px;
            }

            .slide-desc {
                font-size: 0.95rem;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .search-section {
                padding: 20px;
            }

            .carousel-btn {
                width: 35px;
                height: 35px;
                font-size: 1rem;
            }

            .carousel-prev {
                left: 10px;
            }

            .carousel-next {
                right: 10px;
            }
        }

        .manga-decoration {
            position: absolute;
            background-color: #fff;
            color: #000;
            border: 3px solid #000;
            font-family: 'Bangers', cursive;
            padding: 8px 16px;
            font-size: 1.4rem;
            z-index: 5;
            box-shadow: 4px 4px 0 #000;
            letter-spacing: 1px;
        }

        .deco-boom {
            top: 20px;
            left: 20px;
            transform: rotate(-15deg);
            background-color: var(--accent-yellow);
        }

        .deco-pow {
            bottom: 20px;
            right: 20px;
            transform: rotate(10deg);
            background-color: var(--accent-red);
            color: #fff;
        }

        .letter-btn.nostal-btn {
            width: auto;
            white-space: nowrap;
            background: linear-gradient(135deg, #ff3e3e, #f5b041);
            color: white;
            font-weight: 800;
            border: 2px solid #000;
            padding: 5px 15px;
            box-shadow: 2px 2px 0 #000;
            text-transform: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border-radius: 6px;
        }
        .letter-btn.nostal-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 #000;
            background: linear-gradient(135deg, #f5b041, #ff3e3e);
        }
        .letter-btn.nostal-btn.active {
            background: #fff;
            color: #000;
            border-color: #ff3e3e;
            box-shadow: none;
        }

        /* News Section Styles */
        .news-section {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }
        .news-container {
            display: flex;
            align-items: center;
            background: rgba(26, 26, 26, 0.75);
            backdrop-filter: blur(10px);
            border: 2px solid #00ff66;
            border-radius: 8px;
            padding: 8px 15px;
            box-shadow: 4px 4px 0 #00ff66;
            gap: 15px;
            overflow: hidden;
        }
        .news-tag {
            background: #00ff66;
            color: #000;
            font-weight: 900;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            letter-spacing: 1px;
            box-shadow: 2px 2px 0 #000;
            border: 1px solid #000;
            animation: pulse-border 2s infinite;
        }
        .news-content {
            flex-grow: 1;
            font-size: 0.9rem;
            color: #eee;
            font-weight: 600;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            display: flex;
            align-items: center;
            height: 24px;
        }
        .news-marquee {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 40s linear infinite;
        }
        .news-item {
            display: inline-block;
            margin-right: 50px;
            position: relative;
        }
        .news-item::after {
            content: "✦";
            color: #00ff66;
            margin-left: 25px;
        }
        .news-item:last-child::after {
            content: "";
        }
        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        @keyframes pulse-border {
            0% { box-shadow: 2px 2px 0 #000; }
            50% { box-shadow: 4px 4px 0 #000; }
            100% { box-shadow: 2px 2px 0 #000; }
        }
    </style>

            { "id_name": "chie", "name": "Chie - Cô Bé Hạt Tiêu", "title": "Chie - Cô Bé Hạt Tiêu", "img": "covers/chie.jpg", "bg": "backgrounds/chie.jpg", "tagline": "Cô bé hạt tiêu giàu nghị lực và cuộc sống gia đình siêu hài hước!", "accent": "#ff66cc" },
            { "id_name": "chu_thoong", "name": "Chú Thoòng", "title": "Chú Thoòng", "img": "covers/chu_thoong.jpg", "bg": "backgrounds/chu_thoong.jpg", "tagline": "Châm biếm hài hước sâu cay qua những tình huống dở khóc dở cười!", "accent": "#ffd700" },
            { "id_name": "dr_stone", "name": "Dr Stone", "title": "Dr Stone", "img": "covers/dr_stone.jpg", "bg": "backgrounds/dr_stone.jpg", "tagline": "Khôi phục nền văn minh nhân loại bằng sức mạnh khoa học vĩ đại!", "accent": "#00ffcc" },
            { "id_name": "doi_quan_nhi_nho", "name": "Đội Quân Nhí Nhố", "title": "Đội Quân Nhí Nhố", "img": "covers/doi_quan_nhi_nho.jpg", "bg": "backgrounds/doi_quan_nhi_nho.jpg", "tagline": "Lớp học nghịch ngợm siêu quậy đầy ắp những pha hài hước té ghế!", "accent": "#ff99cc" }
        ];

        // Pagination and filter states
        let itemsPerPage = 36;
        let currentPage = 1;
        let filteredManga = [...mangaData];
        let currentSearchQuery = "";
        let currentLetterFilter = "all";
        let activeSlideIndex = 0;

        // Elements
        const mangaGrid = document.getElementById("mangaGrid");
        const searchInput = document.getElementById("searchInput");
        const statsBadge = document.getElementById("statsBadge");
        const alphabetNav = document.getElementById("alphabetNav");
        const carousel = document.getElementById("carousel");
        const prevSlideBtn = document.getElementById("prevSlide");
        const nextSlideBtn = document.getElementById("nextSlide");
        const carouselDotsContainer = document.getElementById("carouselDots");
        const backToTopBtn = document.getElementById("backToTop");
        const paginationContainer = document.getElementById("pagination");
        const paginationInfo = document.getElementById("paginationInfo");
        const pageSizeSelect = document.getElementById("pageSizeSelect");
        const shurikenContainer = document.getElementById("shuriken-container");

        // Spawn falling shurikens (Ninja stars) - HIGHER VISIBILITY & METALLIC SHADOWS
        function initShurikens() {
            const numShurikens = 18; // Slightly more particles
            // 8-pointed shuriken path SVG
            const shurikenSVG = `
                <svg viewBox="0 0 100 100" fill="currentColor" style="width: 100%; height: 100%; filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.65));">
                    <path d="M50 5 L55 35 L85 20 L65 45 L95 50 L65 55 L85 80 L55 65 L50 95 L45 65 L15 80 L35 55 L5 50 L35 45 L15 20 L45 35 Z M50 43 A 7 7 0 1 1 50 57 A 7 7 0 1 1 50 43 Z" />
                </svg>
            `;

            for (let i = 0; i < numShurikens; i++) {
                const particle = document.createElement("div");
                particle.className = "shuriken-particle";
                particle.innerHTML = shurikenSVG;

                // Random styling for realistic natural fall
                const size = Math.random() * 25 + 20; // 20px to 45px
                const duration = Math.random() * 9 + 5; // 5s to 14s (slightly faster for dynamic feeling)
                const delay = Math.random() * -15; // pre-start so they fall immediately on load
                const left = Math.random() * 100; // 0% to 100% width

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${left}%`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;

                // Higher opacity range (25% to 45% visible)
                const opacity = Math.random() * 0.20 + 0.25;

                // Color choices: Alternating between neon red and metallic silver-grey shurikens
                if (Math.random() > 0.4) {
                    particle.style.color = `rgba(255, 62, 62, ${opacity})`; // Neon Red shuriken
                } else {
                    particle.style.color = `rgba(180, 185, 210, ${opacity + 0.1})`; // Metallic Silver shuriken
                }

                shurikenContainer.appendChild(particle);
            }
        }

        // Set up Carousel Banners
        function initCarousel() {
            slideshowData.forEach((item, idx) => {
                // Create Slide
                const slide = document.createElement("div");
                slide.className = `slide ${idx === 0 ? 'active' : ''}`;
                slide.style.backgroundImage = `url('${item.bg}')`;
                slide.innerHTML = `
                    <div class="slide-overlay"></div>
                    <div class="slide-content-wrapper">
                        <div class="slide-content">
                            <span class="slide-badge">Hot Pick</span>
                            <h2 class="slide-title">${item.title}</h2>
                            <p class="slide-desc">${item.tagline}</p>
                        </div>
                        <div class="slide-cover-container">
                            <img class="slide-cover-img" src="${item.img}" alt="${item.name}" onerror="this.onerror=null; this.src='covers/one_piece.png';">
                        </div>
                    </div>
                `;
                // Insert slide before buttons
                carousel.insertBefore(slide, prevSlideBtn);

                // Create Dot
                const dot = document.createElement("div");
                dot.className = `dot ${idx === 0 ? 'active' : ''}`;
                dot.addEventListener("click", () => showSlide(idx));
                carouselDotsContainer.appendChild(dot);
            });
        }

        function showSlide(index) {
            const slides = document.querySelectorAll(".slide");
            const dots = document.querySelectorAll(".dot");
            if (slides.length === 0) return;

            slides[activeSlideIndex].classList.remove("active");
            dots[activeSlideIndex].classList.remove("active");

            activeSlideIndex = (index + slides.length) % slides.length;

            slides[activeSlideIndex].classList.add("active");
            dots[activeSlideIndex].classList.add("active");
        }

        // Slide auto loop
        let slideInterval = setInterval(() => showSlide(activeSlideIndex + 1), 6000);

        prevSlideBtn.addEventListener("click", () => {
            clearInterval(slideInterval);
            showSlide(activeSlideIndex - 1);
            slideInterval = setInterval(() => showSlide(activeSlideIndex + 1), 6000);
        });

        nextSlideBtn.addEventListener("click", () => {
            clearInterval(slideInterval);
            showSlide(activeSlideIndex + 1);
            slideInterval = setInterval(() => showSlide(activeSlideIndex + 1), 6000);
        });

        // Generate Alphabet Nav
        function initAlphabetNav() {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            alphabet.forEach(letter => {
                const btn = document.createElement("button");
                btn.className = "letter-btn";
                btn.textContent = letter;
                btn.setAttribute("data-letter", letter);
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".letter-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    currentLetterFilter = letter.toLowerCase();
                    applyFiltersAndResetPage();
                });
                alphabetNav.appendChild(btn);
            });

            document.querySelector('.letter-btn[data-letter="all"]').addEventListener("click", (e) => {
                document.querySelectorAll(".letter-btn").forEach(b => b.classList.remove("active"));
                e.target.classList.add("active");
                currentLetterFilter = "all";
                applyFiltersAndResetPage();
            });

            document.querySelector('.letter-btn[data-letter="nostalgia"]').addEventListener("click", (e) => {
                document.querySelectorAll(".letter-btn").forEach(b => b.classList.remove("active"));
                e.target.classList.add("active");
                currentLetterFilter = "nostalgia";
                applyFiltersAndResetPage();
            });
        }

        // Helper function to remove accents for fuzzy matching
        function removeAccents(str) {
            return str.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
                .replace(/đ/g, "d");
        }

        // Determine if a manga is one of the featured series, returns background decoration image link if matched
        function getMangaCover(mangaName) {
            const normalizedName = removeAccents(mangaName);
            // Sort featuredData by length descending so that specific longer names match first!
            const sortedFeatured = [...featuredData].sort((a,b) => b.name.length - a.name.length);
            for (const item of sortedFeatured) {
                const normFeatured = removeAccents(item.name);
                if (normalizedName.includes(normFeatured)) {
                    return item.img;
                }
            }
            return "";
        }

                        function isNostalgic(mangaName) {
            const name = removeAccents(mangaName);
            if (name.includes("than dong dat viet")) return true;
            if (name.includes("doremon") || name.includes("doraemon")) return true;
            if (name.includes("conan")) return true;
            if (name.includes("dragon ball")) return true;
            if (name.includes("ty quay")) return true;
            if (name.includes("o long vien")) return true;
            if (name.startsWith("shin -") || name === "shin") return true;
            if (name === "naruto" || name.startsWith("naruto ")) return true;
            if (name.includes("miko")) return true;
            if (name.includes("chu thuat hoi chien") || name.includes("jujutsu kaisen")) return true;
            if (name.includes("inuyasha")) return true;
            if (name.includes("one piece")) return true;
            if (name.includes("chu thoong")) return true;
            if (name.includes("cuon tu dien ky bi")) return true;
            if (name.includes("ninja hattori")) return true;
            if (name.includes("that hinh dai toi")) return true;
            if (name.includes("bleach")) return true;
            if (name.includes("cau be mat troi")) return true;
            if (name.includes("chie - co be hat tieu")) return true;
            if (name.includes("croket")) return true;
            if (name.includes("hello komang")) return true;
            if (name.includes("death note")) return true;
            if (name.includes("dr stone")) return true;
            if (name.includes("dr. slump")) return true;
            if (name.includes("hunter x hunter")) return true;
            if (name.includes("hoang phi hong")) return true;
            if (name.includes("nu hoang ai cap")) return true;
            if (name === "mar" || name.startsWith("mar ") || name.endsWith(" mar")) return true;
            if (name.includes("blue lock")) return true;
            if (name.includes("black jack")) return true;
            if (name.includes("doi quan nhi nho")) return true;
            return false;
        }

        function isFeatured(mangaName) {
            const normalizedName = removeAccents(mangaName);
            for (const item of featuredData) {
                const normFeatured = removeAccents(item.name);
                if (normalizedName.includes(normFeatured)) {
                    return true;
                }
            }
            return false;
        }

        // Apply filters (search & alphabet) and reset page to 1
        function applyFiltersAndResetPage() {
            filteredManga = mangaData;

            // Apply Letter Filter
            if (currentLetterFilter === "nostalgia") {
                filteredManga = filteredManga.filter(item => isNostalgic(item.name));
            } else if (currentLetterFilter !== "all") {
                filteredManga = filteredManga.filter(item => {
                    const cleanedName = removeAccents(item.name).trim();
                    return cleanedName.startsWith(currentLetterFilter);
                });
            }

            // Apply Search Query
            if (currentSearchQuery.trim() !== "") {
                const queryClean = removeAccents(currentSearchQuery);
                filteredManga = filteredManga.filter(item => {
                    const nameClean = removeAccents(item.name);
                    const idClean = item.id.toLowerCase();
                    return nameClean.includes(queryClean) || idClean.includes(queryClean);
                });
            }

            currentPage = 1;
            renderGridAndPagination();
        loadNews();
        }

        // Main render function for Grid & Pagination (Upgraded to smart window pagination)
        function renderGridAndPagination() {
            mangaGrid.innerHTML = "";
            paginationContainer.innerHTML = "";

            statsBadge.textContent = `Đang hiển thị: ${filteredManga.length} / ${mangaData.length} bộ`;

            if (filteredManga.length === 0) {
                mangaGrid.innerHTML = `
                    <div class="no-results">
                        <div class="bubble-container">
                            Trời ơi! Không tìm thấy bộ truyện nào khớp với từ khóa của bạn rồi! Thử từ khóa khác xem sao...
                        </div>
                        <img class="no-results-img" src="covers/crying_chopper.png" alt="Chopper khóc">
                    </div>
                `;
                paginationInfo.textContent = "Không tìm thấy bộ truyện nào";
                document.getElementById("paginationContainer").style.display = "none";
                return;
            }

            document.getElementById("paginationContainer").style.display = "flex";

            // Calculate pagination indexes
            const totalPages = Math.ceil(filteredManga.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, filteredManga.length);

            // Update stats info text
            paginationInfo.textContent = `Hiển thị từ ${startIndex + 1} đến ${endIndex} trong tổng số ${filteredManga.length} bộ truyện`;

            const pageItems = filteredManga.slice(startIndex, endIndex);

            // Render Grid
            pageItems.forEach(item => {
                const card = document.createElement("div");
                card.className = "manga-card";

                const coverUrl = getMangaCover(item.name);
                const featuredBadge = isFeatured(item.name) ? '<span class="featured-tag">HOT ★</span>' : '';

                // Header HTML: if we have cover, render it as full cover image filling the box
                const coverHTML = coverUrl
                    ? `<img class="card-cover-full" src="${coverUrl}" alt="${item.name}" onerror="this.onerror=null; this.outerHTML='<div class=&quot;generic-cover&quot;>${item.name.charAt(0)}</div>';">`
                    : `<div class="generic-cover">${item.name.charAt(0)}</div>`;

                // Render card: compact style with cover image or letters filling 100% of header
                card.innerHTML = `
                    <div class="card-header">
                        <span class="id-badge">${item.id}</span>
                        ${featuredBadge}
                        ${coverHTML}
                        <div class="card-title-box">
                            <h3 class="manga-title" title="${item.name}">${item.name}</h3>
                        </div>
                    </div>
                `;
                mangaGrid.appendChild(card);
            });

            // Smart Pagination Button Window Generator
            if (totalPages > 1) {
                // First & Prev buttons
                const prevBtn = document.createElement("button");
                prevBtn.className = "page-btn";
                prevBtn.textContent = "◀";
                prevBtn.disabled = currentPage === 1;
                prevBtn.addEventListener("click", () => {
                    currentPage--;
                    window.scrollTo({ top: 400, behavior: "smooth" });
                    renderGridAndPagination();
        loadNews();
                });
                paginationContainer.appendChild(prevBtn);

                // Page 1 (always display)
                const firstPageBtn = document.createElement("button");
                firstPageBtn.className = `page-btn ${currentPage === 1 ? 'active' : ''}`;
                firstPageBtn.textContent = "1";
                firstPageBtn.addEventListener("click", () => {
                    currentPage = 1;
                    window.scrollTo({ top: 400, behavior: "smooth" });
                    renderGridAndPagination();
        loadNews();
                });
                paginationContainer.appendChild(firstPageBtn);

                // Left ellipsis
                if (currentPage > 3) {
                    const dots = document.createElement("span");
                    dots.className = "page-ellipsis";
                    dots.textContent = "...";
                    paginationContainer.appendChild(dots);
                }

                // Core neighbors
                let startPage = Math.max(2, currentPage - 1);
                let endPage = Math.min(totalPages - 1, currentPage + 1);

                // Adjust sliding boundaries
                if (currentPage <= 2) {
                    endPage = Math.min(totalPages - 1, 4);
                }
                if (currentPage >= totalPages - 1) {
                    startPage = Math.max(2, totalPages - 3);
                }

                for (let p = startPage; p <= endPage; p++) {
                    const pageBtn = document.createElement("button");
                    pageBtn.className = `page-btn ${p === currentPage ? 'active' : ''}`;
                    pageBtn.textContent = p;
                    pageBtn.addEventListener("click", () => {
                        currentPage = p;
                        window.scrollTo({ top: 400, behavior: "smooth" });
                        renderGridAndPagination();
        loadNews();
                    });
                    paginationContainer.appendChild(pageBtn);
                }

                // Right ellipsis
                if (currentPage < totalPages - 2) {
                    const dots = document.createElement("span");
                    dots.className = "page-ellipsis";
                    dots.textContent = "...";
                    paginationContainer.appendChild(dots);
                }

                // Last page (always display)
                const lastPageBtn = document.createElement("button");
                lastPageBtn.className = `page-btn ${currentPage === totalPages ? 'active' : ''}`;
                lastPageBtn.textContent = totalPages;
                lastPageBtn.addEventListener("click", () => {
                    currentPage = totalPages;
                    window.scrollTo({ top: 400, behavior: "smooth" });
                    renderGridAndPagination();
        loadNews();
                });
                paginationContainer.appendChild(lastPageBtn);

                // Next & Last buttons
                const nextBtn = document.createElement("button");
                nextBtn.className = "page-btn";
                nextBtn.textContent = "▶";
                nextBtn.disabled = currentPage === totalPages;
                nextBtn.addEventListener("click", () => {
                    currentPage++;
                    window.scrollTo({ top: 400, behavior: "smooth" });
                    renderGridAndPagination();
        loadNews();
                });
                paginationContainer.appendChild(nextBtn);
            }
        }

        // Listen for changes in items-per-page select box
        pageSizeSelect.addEventListener("change", (e) => {
            itemsPerPage = parseInt(e.target.value);
            currentPage = 1;
            renderGridAndPagination();
        loadNews();
        });

        // Event Listeners
        searchInput.addEventListener("input", (e) => {
            currentSearchQuery = e.target.value;
            applyFiltersAndResetPage();
        });

        // Focus search bar on '/' key
        window.addEventListener("keydown", (e) => {
            if (e.key === "/" && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
        });

        // Scroll back to top logic
        window.addEventListener("scroll", () => {
            if (window.scrollY > 400) {
                backToTopBtn.classList.add("visible");
            } else {
                backToTopBtn.classList.remove("visible");
            }
        });

        backToTopBtn.addEventListener("click", () => {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });


        async function loadNews() {
            try {
                const response = await fetch('news.txt');
                if (!response.ok) return;
                const text = await response.text();
                const lines = text.split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0);
                
                if (lines.length > 0) {
                    const newsSection = document.getElementById('newsSection');
                    const newsContent = document.getElementById('newsContent');
                    
                    const marquee = document.createElement('div');
                    marquee.className = 'news-marquee';
                    
                    lines.forEach(line => {
                        const item = document.createElement('span');
                        item.className = 'news-item';
                        item.textContent = line;
                        marquee.appendChild(item);
                    });
                    
                    newsContent.appendChild(marquee);
                    newsSection.style.display = 'block';
                }
            } catch (err) {
                console.error("Failed to load news.txt", err);
            }
        }

        // Run on start
        initShurikens();
        initCarousel();
        initAlphabetNav();
        renderGridAndPagination();
        loadNews();
    </script>
</body>
